# ==================== 境途同游 Web — 飞牛 fnOS 单文件部署 ====================
# 用法：
#   1. 飞牛 → Docker → 项目（编排）→ 新建项目，名称填 jingtu（必须与旧项目同名，
#      或先删除旧项目后重建，容器名 jingtu-web / jingtu-db 会被新项目接管）
#   2. 把本文件【整个内容】粘贴进 docker-compose 编辑框（或上传本文件）
#   3. 替换下方 4 个密钥/密码占位符（可直接用会话里生成的随机值），点「保存并启动」
#   4. 等两个容器变 healthy（首次构建约 1~2 分钟）→ 浏览器打开网站 → 自动跳转
#      「初始化管理员」页 → 只需填【账号 + 密码 + 显示名】→ 完成！
#
# 【自动拉取源码】app 的 build 指向 Gitee 仓库，构建时 Docker 会自动 clone 代码
#   （要求：Gitee 仓库设为公开，否则匿名拉取 404）。GitHub 有同源备份。
#
# 【存储位置】本项目所有数据已改为【绑定挂载】，统一存放在飞牛【存储空间3】：
#   /vol3/1001/jingtu/ ...  （存储空间3 根目录不允许建目录，需在用户目录 /vol3/1001 下建）
#   compose 自带 init 一次性容器：启动时自动创建目录并 chown 给 1000:1000
#   （与 node:22-slim 的 node 用户 uid 一致），无需手动建目录。
#   迁移注意：旧数据位于 /vol1/docker/volumes/jingtu_*（Docker 默认数据目录），
#   全新部署默认不迁移旧数据；如需保留旧库数据请自行拷贝。
#
# 无需配置的内容（系统自动处理）：
#   ✅ 数据库/建表 —— 入口脚本自动执行 db_init，无需手动建库。
#   ✅ 超管账号 —— 在网站「初始化管理员」页创建（本镜像已预置可写的 .env）。
#   ✅ 剩余业务配置 —— 登录后台后可在网页里配置（VRChat 账号绑定、公告、
#      相册、激活码等）；基础信息类（站点名/SMTP 等）写在下方环境变量里。
#
# ⚠️ 必改项（不替换就启动 = 公开弱口令上线，任何人可登录你的数据库）：
#   <DB_ROOT_PASSWORD>   MySQL root 密码 → 强随机
#   <DB_PASSWORD>        应用数据库密码 → 强随机
#   <SESSION_SECRET>      会话签名密钥 → 48 字节随机十六进制
#   <ENCRYPT_KEY>         数据加密密钥 → 必须 64 位十六进制（64 hex，32 字节）；长度/格式不符时
#                          生产环境启动直接 fail-fast 拒绝运行（server 启动校验），缺失同样拒启。
#
# 生成随机密钥（本机任选一种执行，结果粘贴替换上方占位符）：
#   openssl rand -hex 48      # → SESSION_SECRET（96 个十六进制字符）
#   openssl rand -hex 32      # → ENCRYPT_KEY（64 个十六进制字符，符合 64hex 要求）
# 或 Node 方式：
#   node -e "console.log(require('crypto').randomBytes(48).toString('hex'))"   # SESSION_SECRET
#   node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"   # ENCRYPT_KEY
# MySQL 密码可用：openssl rand -base64 24（不含换行的可打印串）
# =============================================================================

services:
  # 一次性初始化：以 root 创建 /vol3/1001/jingtu 各数据目录并 chown 给 1000:1000
  # （node:22-slim 镜像中 node 用户的 uid/gid 均为 1000），确保 app 容器可写。
  init:
    image: docker.m.daocloud.io/library/busybox:1.36
    container_name: jingtu-init
    restart: "no"
    user: "0:0"
    command:
      - sh
      - -c
      - mkdir -p /data/uploads /data/backups /data/logs /data/assets /data/data && chown -R 1000:1000 /data/uploads /data/backups /data/logs /data/assets /data/data && chmod 775 /data /data/uploads /data/backups /data/logs /data/assets /data/data && echo INIT_OK
    volumes:
      - /vol3/1001/jingtu:/data
    networks:
      - jingtu-net

  db:
    # 国内镜像源（DaoCloud）：绕开飞牛失效的内置加速器 docker.fnnas.com（401 Unauthorized）
    image: docker.m.daocloud.io/library/mysql:8.0
    container_name: jingtu-db
    restart: unless-stopped
    # MySQL 8 关闭需冲刷 InnoDB 缓冲（大库可能超默认 10s）；给足宽限避免被 SIGKILL
    stop_grace_period: 30s
    environment:
      MYSQL_ROOT_PASSWORD: "<DB_ROOT_PASSWORD>"
      MYSQL_DATABASE: jingtu_group
      MYSQL_USER: jingtu_user
      MYSQL_PASSWORD: "<DB_PASSWORD>"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      # 存储空间3（飞牛挂载点 /vol3，实际目录 /vol3/1001/jingtu）——数据库数据目录
      - /vol3/1001/jingtu/db_data:/var/lib/mysql
    healthcheck:
      # O7：原来把 <DB_ROOT_PASSWORD> 明文写进 -p<口令>（compose 文件与 ps 进程列表都可见）。
      # 改走容器内环境变量：CMD-SHELL 里取 MYSQL_ROOT_PASSWORD（db 服务 environment 已注入），
      # 用 MYSQL_PWD 传密 —— $$ 转义 $ 交由 compose 解析器，运行时容器 shell 再展开，口令不再落盘明文。
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_ROOT_PASSWORD}\" mysqladmin ping -h127.0.0.1 --silent"]
      # 飞牛 NAS 上 MySQL 首次初始化可能超过 2 分钟，放宽等待预算：
      # start_period 90s + 36 × 10s ≈ 最长 7.5 分钟，避免初始化稍慢被误判 unhealthy
      interval: 10s
      timeout: 5s
      retries: 36
      start_period: 90s
    logging:
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - jingtu-net

  app:
    # 自动从 Gitee 拉取源码构建（Gitee 需设为公开仓库；GitHub 备份同源码）。
    # ⚠️ O3 修复说明（必读）：
    #   compose build 规范【没有】独立的 ref: 字段，git 分支/标签只能写在与 URL
    #   相连的 #fragment 上（官方语法 https://…/repo.git#branch，分支名后还可加
    #   :子目录）。# 若写成【不带引号】的 YAML 纯量，部分编辑器/解析器会把 # 误判为
    #   行注释起点而把分支吞掉 → 构建拉到默认分支的旧代码（本文件历史上因此钉死失效）。
    #   这里【必须加双引号】——引号串内 # 恒为字面量，任何解析器都不会再截断。
    #   若你的平台仍异常：改用 tag 钉住（如 #v1.0.0），或本地 git clone 后把
    #   context 改为目录路径（如 ./），或改 image: 从私有镜像仓库拉取。
    #   同源备份：https://github.com/266767398/jingtu-web.git
    build:
      context: "https://gitee.com/htmcwy_0/jingtu-web.git#jingtu-web"
      args:
        # 国内镜像源（DaoCloud）：绕开飞牛失效的内置加速器 docker.fnnas.com（401 Unauthorized）
        NODE_IMAGE: docker.m.daocloud.io/library/node:22-slim
    image: jingtu-web:latest
    container_name: jingtu-web
    restart: unless-stopped
    # 优雅关闭含 HTTP 排空(≤5s)+连接池/Redis 释放，默认 10s 可能被 SIGKILL(退出码137)
    stop_grace_period: 30s
    depends_on:
      db:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3456
      # 反代在后（飞牛自带反代 / Nginx），必须为 1：限流与黑名单才按真实客户端 IP 计数
      TRUST_PROXY: "1"
      # 容器内通过服务名 db 访问数据库
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: jingtu_group
      MYSQL_USER: jingtu_user
      MYSQL_PASSWORD: "<DB_PASSWORD>"
      # 必填密钥（缺失则生产模式拒绝启动）
      SESSION_SECRET: "<SESSION_SECRET>"
      ENCRYPT_KEY: "<ENCRYPT_KEY>"
      # 站点对外地址（邮件内链接、sitemap 使用）——【必须替换为你的公网地址】，
      # 否则邮件内链接回退 localhost，用户点不进来。示例仅供占位：
      APP_URL: "https://jingtu.example.com"
      # VRChat 群组接入（管理后台可再改）
      GROUP_ID: grp_7a45b436-159c-4d9c-8303-e186ec25fc35
      VRC_API_KEY: ""
      VRC_GROUP_URL: ""
      # 运维面板（panel/）为 Windows 专属工具链，容器镜像不打包；
      # 显式禁用入口后后台隐藏「运维面板」按钮，避免点击报「启动失败」
      PANEL_ENABLED: "0"
      # ---- 以下可选，按需取消注释并填值 ----
      # CORS_ORIGINS: "https://jingtu.example.com"
      # KOOK_URL: ""
      # OOPZ_URL: ""
      # SMTP_HOST: ""
      # SMTP_PORT: 587
      # SMTP_USER: ""
      # SMTP_PASS: ""
      # SMTP_FROM: ""
      # ADMIN_EMAIL: ""
      # RECOVERY_TOKEN: ""
      # LOG_LEVEL: INFO
      # FILE_RETENTION_DAYS: 90
      # NOTIFICATION_RETENTION_DAYS: 30
      # BACKUP_RETENTION_DAYS: 7
    ports:
      # 只绑飞牛本机回环，公网流量一律走反代进来（最安全）
      - "127.0.0.1:3456:3456"
    volumes:
      # 存储空间3（飞牛挂载点 /vol3，实际目录 /vol3/1001/jingtu）——应用数据目录
      - /vol3/1001/jingtu/uploads:/app/uploads
      - /vol3/1001/jingtu/backups:/app/backups
      - /vol3/1001/jingtu/logs:/app/logs
      - /vol3/1001/jingtu/assets:/app/assets
      - /vol3/1001/jingtu/data:/app/server/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3456/api/health/live',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    logging:
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - jingtu-net

networks:
  jingtu-net:
    driver: bridge

# =============================================================================
# 反代配置（部署完成后在飞牛本机执行）：
#
#   A. 飞牛自带反代：源站填 http://127.0.0.1:3456，域名绑定你的域名即可；
#      确认转发请求头含 X-Forwarded-For / X-Forwarded-Proto。
#
#   B. 用仓库现成 Nginx 模板（deploy/nginx/jingtu.conf，已含 WebSocket Upgrade
#      联动、500MB 上传上限、登录/API 限流），只需替换两处占位符：
#        __DOMAIN__ → 你的域名
#        __PORT__   → 3456
#
# 验证：
#   docker compose ps                         # 两个容器 running + healthy
#   curl -fsS https://你的域名/api/health/ready   # 返回 ok
# 常用：docker compose logs -f app；docker compose down（数据在卷中保留）
# =============================================================================
