<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>境途同游 · 运维控制台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%237c5cfc'/%3E%3Ctext x='16' y='22' font-size='15' fill='white' text-anchor='middle' font-family='sans-serif'%3E境%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#0f1117;--bg2:#14161f;--card:#171a23;--card2:#1c2030;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);--txt:#e8eaf2;--muted:#8b90a3;--dim:#5c6173;--brand:#7c5cfc;--brand2:#9d7bff;--brand-grad:linear-gradient(135deg,#6a5cff,#8b5cf6);--ok:#22c55e;--warn:#f59e0b;--err:#ef4444;--mono:'Cascadia Mono','Consolas',monospace}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
body{font-family:'Segoe UI',system-ui,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--txt);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#2a2f40;border-radius:6px}
button{font-family:inherit;cursor:pointer;border:none;outline:none;color:inherit}input{font-family:inherit;color:var(--txt)}a{color:var(--brand2)}
#authWrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(1000px 600px at 70% -10%,rgba(124,92,252,.18),transparent 60%),var(--bg);z-index:50}
.auth-card{width:380px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:34px 32px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.auth-logo{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.logo-badge{width:44px;height:44px;border-radius:12px;background:var(--brand-grad);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:#fff;box-shadow:0 8px 24px rgba(124,92,252,.4)}
.auth-title{font-size:20px;font-weight:700}.auth-sub{color:var(--muted);font-size:12.5px;margin:4px 0 22px}
.auth-hint{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--muted);font-size:12.5px;margin-bottom:16px}
.fld{margin-bottom:14px}.fld label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.fld input{width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;font-size:14px}
.fld input:focus,.form-row input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(124,92,252,.18)}
.btn-primary{width:100%;padding:11px;border-radius:10px;background:var(--brand-grad);font-weight:600;font-size:14px;color:#fff;transition:.2s}
.btn-primary:hover{filter:brightness(1.1)}.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.auth-err{color:var(--err);font-size:12.5px;margin-top:10px;min-height:18px}
#app{display:none;height:100vh;flex-direction:column}
.topbar{height:56px;display:flex;align-items:center;gap:14px;padding:0 18px;background:var(--card);border-bottom:1px solid var(--line);z-index:20}
.topbar .logo-badge{width:32px;height:32px;border-radius:9px;font-size:15px}
.brand{font-weight:700;font-size:15px}.brand small{color:var(--muted);font-weight:400;margin-left:8px;font-size:11.5px}
.spacer{flex:1}.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--line);border-radius:20px;padding:4px 12px;font-size:12px;color:var(--muted)}
.chip-warn{color:#fbbf24;border-color:rgba(251,191,36,.35);background:rgba(251,191,36,.07)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
.dot.ok{background:var(--ok);box-shadow:0 0 8px rgba(34,197,94,.7)}.dot.err{background:var(--err);box-shadow:0 0 8px rgba(239,68,68,.7)}.dot.warn{background:var(--warn)}
.link-btn{background:transparent;color:var(--muted);font-size:12.5px;padding:6px 10px;border-radius:8px}.link-btn:hover{background:var(--card2);color:var(--txt)}
.layout{flex:1;display:flex;min-height:0}
.sidebar{width:200px;flex:none;background:var(--card);border-right:1px solid var(--line);padding:12px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.sidebar .grp{font-size:11px;color:var(--dim);padding:12px 10px 4px;letter-spacing:.5px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;color:var(--muted);font-size:13.5px;transition:.15s;text-align:left;width:100%;background:transparent}
.nav-item:hover{background:var(--card2);color:var(--txt)}
.nav-item.active{background:var(--brand-grad);color:#fff;font-weight:600;box-shadow:0 6px 18px rgba(124,92,252,.35)}
.nav-item svg{width:17px;height:17px;flex:none}
.main{flex:1;overflow-y:auto;padding:22px 26px}
.page{display:none}.page.active{display:block;animation:fadein .22s}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.page-head{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.page-head h2{font-size:19px;font-weight:700}.page-head p{color:var(--muted);font-size:12.5px;margin-top:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.card-title{font-size:14px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card-title svg{width:16px;height:16px;flex:none;stroke:var(--brand2)}
.grid{display:grid;gap:14px}.grid.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.grid.g4{grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
.svc-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;position:relative;overflow:hidden}
.svc-card::before{content:'';position:absolute;inset:0 0 auto 0;height:3px;background:var(--dim)}
.svc-card.on::before{background:linear-gradient(90deg,var(--ok),#4ade80)}
.svc-card.off::before{background:linear-gradient(90deg,var(--err),#f87171)}
.svc-top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.svc-top .name{font-size:15px;font-weight:700}
.svc-top .port{margin-left:auto;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:2px 8px;font-size:11px;color:var(--muted);font-family:var(--mono)}
.svc-meta{color:var(--muted);font-size:12px;line-height:1.9}
.svc-actions{display:flex;gap:8px;margin-top:14px}
.btn{border-radius:9px;padding:7px 14px;font-size:12.5px;font-weight:600;transition:.15s;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2)}
.btn:hover{filter:brightness(1.12)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-success{background:rgba(34,197,94,.14);color:#4ade80;border-color:rgba(34,197,94,.3)}
.btn-danger{background:rgba(239,68,68,.14);color:#f87171;border-color:rgba(239,68,68,.3)}
.btn-brand{background:var(--brand-grad);color:#fff;border:none}
.btn-ghost{background:var(--card2);color:var(--txt)}
.btn-warn{background:rgba(245,158,11,.14);color:#fbbf24;border-color:rgba(245,158,11,.3)}
.stat{display:flex;align-items:center;gap:14px}
.stat .ic{width:40px;height:40px;border-radius:11px;background:var(--card2);display:flex;align-items:center;justify-content:center;flex:none}
.stat .ic svg{width:20px;height:20px;stroke:var(--brand2)}
.stat .num{font-size:20px;font-weight:700;line-height:1.2}.stat .lbl{font-size:11.5px;color:var(--muted)}
table{width:100%;border-collapse:collapse}
th{font-size:11.5px;color:var(--dim);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-weight:600}
td{padding:9px 10px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
tr:hover td{background:rgba(255,255,255,.02)}
.mono{font-family:var(--mono);font-size:12px}
.logbox{background:#0b0d12;border:1px solid var(--line);border-radius:10px;padding:12px;font-family:var(--mono);font-size:12px;color:#9fb3c8;white-space:pre-wrap;word-break:break-all;max-height:300px;overflow-y:auto;line-height:1.65}
.logbox .err{color:#f87171}.logbox .ok{color:#4ade80}.logbox .warn{color:#fbbf24}
.form-row{display:flex;gap:10px;margin-bottom:12px;align-items:center;flex-wrap:wrap}
.form-row input[type=text],.form-row input[type=password],.form-row input[type=number]{background:var(--bg2);border:1px solid var(--line2);border-radius:9px;padding:8px 12px;font-size:13px;flex:1;min-width:160px}
.check{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:pointer}
.check input{accent-color:var(--brand);width:15px;height:15px}
.danger-zone{border:1px dashed rgba(239,68,68,.4);background:rgba(239,68,68,.05);border-radius:14px;padding:16px;margin-top:16px}
.danger-zone .dz-title{color:#f87171;font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.dz-desc{color:var(--muted);font-size:12.5px;margin-bottom:12px}
#toastBox{position:fixed;top:70px;right:20px;z-index:99;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--card);border:1px solid var(--line2);border-radius:10px;padding:10px 16px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:slidein .25s;max-width:340px}
.toast.ok{border-color:rgba(34,197,94,.4)}.toast.err{border-color:rgba(239,68,68,.5)}.toast.warn{border-color:rgba(245,158,11,.4)}
@keyframes slidein{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
#modalMask{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:80}
#modalMask.show{display:flex}
.modal{width:440px;max-width:92vw;background:var(--card);border:1px solid var(--line2);border-radius:16px;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.modal h3{font-size:16px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.modal .modal-body{font-size:13px;color:var(--muted);margin-bottom:16px;line-height:1.7}
.modal .modal-actions{display:flex;gap:10px;justify-content:flex-end}
.modal input{width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:9px;padding:9px 12px;font-size:13px;margin-bottom:12px}
.mono-phrase{font-family:var(--mono);background:var(--card2);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:12px;color:#fbbf24;user-select:all}
#opPanel{position:fixed;left:0;right:0;bottom:0;height:260px;background:#0b0d12;border-top:1px solid var(--line2);z-index:30;transform:translateY(calc(100% - 34px));transition:transform .25s}
#opPanel.open{transform:none}
#opPanel .op-head{height:34px;display:flex;align-items:center;gap:10px;padding:0 14px;cursor:pointer;background:var(--card)}
#opPanel .op-head .t{font-size:12.5px;color:var(--muted)}
#opPanel .op-body{padding:10px 14px;height:calc(100% - 34px);overflow-y:auto;font-family:var(--mono);font-size:12px;color:#9fb3c8;line-height:1.8;white-space:pre-wrap;word-break:break-all}
.empty{color:var(--dim);text-align:center;padding:30px 0;font-size:13px}
.muted{color:var(--muted)}
.wiz-steps{display:flex;gap:6px;margin-bottom:16px}
.wiz-step{flex:1;text-align:center;font-size:11.5px;color:var(--muted);background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:6px 0;transition:.2s}
.wiz-step.on{background:var(--brand-grad);color:#fff;border-color:transparent;font-weight:600}
.wiz-step.done{color:#4ade80;border-color:rgba(34,197,94,.3)}
.svc-quick{display:flex;flex-direction:column;gap:8px}
.sq-row{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.sq-port{font-family:var(--mono);font-size:11.5px;color:var(--dim)}
#perfCanvas{width:100%;display:block;background:var(--bg2);border:1px solid var(--line);border-radius:10px;margin-top:8px}
.meter{height:5px;border-radius:4px;background:var(--card2);overflow:hidden;margin-top:10px}
.meter i{display:block;height:100%;border-radius:4px;background:var(--brand-grad);transition:width .45s ease}
.meter.warn i{background:linear-gradient(90deg,#f59e0b,#ef4444)}
.legend{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);margin-left:4px;flex:none}
.legend .lg{width:16px;height:3px;border-radius:2px;display:inline-block}
.lg-cpu{background:#22d3ee}.lg-mem{background:#a78bfa}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:rot .8s linear infinite;vertical-align:-2px}
@keyframes rot{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="authWrap">
  <div class="auth-card">
    <div class="auth-logo"><div class="logo-badge">境</div><div><div class="auth-title">境途同游 · 运维控制台</div></div></div>
    <div class="auth-sub">本机服务与数据运维后台 · 端口 3457</div>
    <div id="authInit" style="display:none">
      <div class="wiz-steps">
        <span class="wiz-step on" id="ws1">1 环境检测</span>
        <span class="wiz-step" id="ws2">2 设置密码</span>
        <span class="wiz-step" id="ws3">3 完成</span>
      </div>
      <div id="wizPane1">
        <div class="auth-hint">欢迎使用<b>境途同游 · 运维控制台</b>。开始前先检测本机运行环境，确认 MySQL / Nginx / Node 可执行文件与关键文件就绪。</div>
        <div id="wizEnv"><div class="empty"><span class="spin"></span> 检测中…</div></div>
        <button class="btn-primary" id="wizNext" style="margin-top:14px">下一步：设置管理密码</button>
      </div>
      <div id="wizPane2" style="display:none">
        <div class="auth-hint">设置<b>面板管理密码</b>（至少 8 位）。该密码仅用于登录此运维控制台，与网站账号无关。</div>
        <div class="fld"><label>设置管理密码</label><input type="password" id="initPwd" placeholder="至少 8 位"></div>
        <div class="fld"><label>确认密码</label><input type="password" id="initPwd2" placeholder="再次输入"></div>
        <button class="btn-primary" id="initBtn">初始化并进入</button>
        <div class="auth-err" id="authErr"></div>
      </div>
      <div id="wizPane3" style="display:none">
        <div class="auth-hint" style="border-color:rgba(34,197,94,.3);color:#4ade80">✓ 初始化完成，面板已就绪。</div>
        <div class="form-row" style="margin-top:12px;flex-wrap:nowrap">
          <button class="btn btn-brand" id="wizStartAll" style="flex:1">一键启动全部服务</button>
          <button class="btn btn-ghost" id="wizEnter" style="flex:1">直接进入</button>
        </div>
      </div>
    </div>
    <div id="authLogin" style="display:none">
      <div class="fld"><label>面板管理密码</label><input type="password" id="loginPwd" placeholder="输入密码"></div>
      <button class="btn-primary" id="loginBtn">登录</button>
      <div class="auth-err" id="authErr2"></div>
    </div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div class="logo-badge">境</div>
    <div class="brand">境途同游 <small>运维控制台</small></div>
    <div class="spacer"></div>
    <span class="chip"><span class="dot" id="chipMysql"></span>MySQL</span>
    <span class="chip"><span class="dot" id="chipNginx"></span>Nginx</span>
    <span class="chip"><span class="dot" id="chipNode"></span>NodeServer</span>
    <span class="chip" id="chipDisk"><span class="dot warn"></span>磁盘 --</span>
    <button class="link-btn" id="btnLogout">退出登录</button>
  </div>
  <div class="layout">
    <nav class="sidebar" id="sidebar"></nav>
    <div class="main">
      <section class="page" id="page-dashboard"></section>
      <section class="page" id="page-services"></section>
      <section class="page" id="page-site"></section>
      <section class="page" id="page-backup"></section>
      <section class="page" id="page-activation"></section>
      <section class="page" id="page-logs"></section>
      <section class="page" id="page-tools"></section>
      <section class="page" id="page-security"></section>
      <section class="page" id="page-audit"></section>
    </div>
  </div>
</div>

<div id="opPanel">
  <div class="op-head" id="opHead">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#8b90a3" stroke-width="2"><path d="M8 6l6 6-6 6"/></svg>
    <span class="t">操作输出面板</span><span class="t" id="opStatus" style="margin-left:auto;color:var(--dim)"></span>
    <button class="link-btn" id="opClear">清空</button>
  </div>
  <div class="op-body" id="opBody"></div>
</div>

<div id="modalMask"><div class="modal" id="modalBox"></div></div>
<div id="toastBox"></div>

<script>
/* ===== 全局状态 ===== */
const S={token:null,initialized:false,status:null,page:'dashboard',openTasks:{},statTimer:null};
const CONFIRMS={high:'CONFIRM-DELETE-ALL-DATA',restore:'CONFIRM-RESTORE-FROM-BACKUP',kill:'CONFIRM-KILL-PORT',reset:'CONFIRM-RESET-SUPERADMIN'};
const IC={dash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>',
svc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="3" width="20" height="8" rx="2"/><rect x="2" y="13" width="20" height="8" rx="2"/><circle cx="6" cy="7" r="1"/><circle cx="6" cy="17" r="1"/></svg>',
backup:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 8v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8"/><path d="M3 8l3.5-5H13l4 5"/><path d="M8 13h8M12 9v8"/></svg>',
log:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16M4 12h16M4 19h10"/></svg>',
tools:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18v3h3l6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-3-3z"/></svg>',
sec:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15" r="1.5"/></svg>',
audit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>',
site:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.7 4 3 9 3s9-1.3 9-3V5"/><path d="M3 12c0 1.7 4 3 9 3s9-1.3 9-3"/></svg>',ac:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M15 6v12" stroke-dasharray="2.5 2.5"/></svg>'};
const NAV=[{id:'dashboard',t:'仪表盘',i:'dash'},{id:'services',t:'服务管理',i:'svc'},{id:'site',t:'网站管理',i:'site'},{id:'activation',t:'激活码',i:'ac'},{id:'backup',t:'数据备份',i:'backup'},{id:'logs',t:'日志中心',i:'log'},{id:'tools',t:'系统工具',i:'tools'},{id:'security',t:'安全配置',i:'sec'},{id:'audit',t:'审计日志',i:'audit'}];
const NAV_GROUPS=[{label:'监控',items:['dashboard','services','site']},{label:'数据',items:['backup','activation','logs']},{label:'系统',items:['tools','security','audit']}];
const $=id=>document.getElementById(id);
// 经主站反向代理访问时（站点管理后台入口 → 主站 /ops/），所有绝对路径 API/链接需带 /ops 前缀；
// 直接访问面板自身端口（127.0.0.1:3457）时该前缀为空，行为完全不变。
const PANEL_BASE=(function(){const p=(location.pathname||'/').replace(/index\.html$/,'').replace(/\/+$/,'');return p||'';})();

/* ===== 工具 ===== */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(msg,type){const el=document.createElement('div');el.className='toast '+(type||'ok');el.textContent=msg;$('toastBox').appendChild(el);setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .3s';setTimeout(()=>el.remove(),320)},2600)}
function fmtMem(mb){if(mb==null)return'-';return mb<1024?mb.toFixed(1)+' MB':(mb/1024).toFixed(2)+' GB'}
function opLog(msg,cls){const b=$('opBody');const d=document.createElement('div');if(cls)d.className=cls;d.textContent='['+new Date().toLocaleTimeString()+'] '+msg;b.appendChild(d);b.scrollTop=b.scrollHeight}
function api(path,opts){opts=opts||{};opts.headers=Object.assign({'Content-Type':'application/json'},opts.headers||{});if(S.token)opts.headers.Authorization='Bearer '+S.token;
return fetch(PANEL_BASE+path,opts).then(async r=>{if(r.status===401){doLogoutUI();throw new Error('会话已过期');}const t=await r.json().catch(()=>({ok:false,message:'响应解析失败'}));if(!r.ok||t.ok===false)throw new Error(t.message||('请求失败 '+r.status));return t;});}
function svcByName(n){return S.status&&S.status.services?S.status.services.find(s=>s.name===n):null}
function svcCls(s){return s?('svc-card '+(s.running?'on':'off')):'svc-card'}

/* 操作面板 */
function openOp(){document.getElementById('opPanel').classList.add('open')}
function startOpTask(label,runPromise){openOp();opLog(label,'warn');return runPromise.then(r=>{opLog('✓ '+r.message,'ok');toast(r.message,'ok');return r;}).catch(e=>{opLog('✗ '+e.message,'err');toast(e.message,'err');throw e;});}
/* ===== 认证 ===== */
function showAuth(mode){$('authWrap').style.display='flex';$('authInit').style.display=mode==='init'?'block':'none';$('authLogin').style.display=mode==='login'?'block':'none';}
function enterApp(){$('authWrap').style.display='none';$('app').style.display='flex';startPolling();renderNav();switchPage(S.page);}
function doLogoutUI(){S.token=null;clearInterval(S.statTimer);$('app').style.display='none';showAuth('login');toast('已退出登录');}
/* 初始化向导：步骤切换与环境检测渲染 */
function wizGo(step){for(let i=1;i<=3;i++){$('ws'+i).className='wiz-step'+(i===step?' on':(i<step?' done':''));$('wizPane'+i).style.display=i===step?'block':'none';}}
function renderWizEnv(env){const el=$('wizEnv');if(!el)return;
if(!env||!env.length){el.innerHTML='<div class="empty">未获取到环境信息，可直接下一步。</div>';return;}
el.innerHTML='<table><tr><th>检查项</th><th>状态</th></tr>'+env.map(c=>`<tr><td>${esc(c.name)}${c.port?' <span class="muted">('+c.port+')</span>':''}<div class="muted" style="font-size:11px">${esc(c.exe||c.path||'')}</div></td><td>${c.ok?'<span style="color:#4ade80">✓ 就绪</span>':'<span style="color:#fbbf24">✗ 缺失</span>'}</td></tr>`).join('')+'</table>';}
async function initPanel(){const p1=$('initPwd').value,p2=$('initPwd2').value;
if(p1.length<8)return $('authErr').textContent='密码至少 8 位';if(p1!==p2)return $('authErr').textContent='两次密码不一致';
try{const r=await api('/api/init',{method:'POST',body:JSON.stringify({password:p1})});S.token=r.token;wizGo(3);}catch(e){$('authErr').textContent=e.message;}}
function wizStartAll(){$('wizStartAll').textContent='启动中…';$('wizStartAll').disabled=true;
api('/api/service',{method:'POST',body:JSON.stringify({action:'start',name:'all'})}).then(r=>{opLog(r.message,'ok');enterApp();}).catch(e=>{opLog('一键启动失败：'+e.message,'err');enterApp();});}
async function doLogin(){try{const r=await api('/api/login',{method:'POST',body:JSON.stringify({password:$('loginPwd').value})});S.token=r.token;$('authErr2').textContent='';enterApp();}catch(e){$('authErr2').textContent=e.message;}}

/* ===== 导航 ===== */
function renderNav(){const sb=$('sidebar');
sb.innerHTML=NAV_GROUPS.map(g=>`<div class="grp">${g.label}</div>`+g.items.map(id=>{const n=NAV.find(x=>x.id===id);return `<button class="nav-item ${S.page===n.id?'active':''}" data-p="${n.id}">${IC[n.i]}${n.t}</button>`;}).join('')).join('');
sb.querySelectorAll('.nav-item').forEach(b=>b.onclick=()=>{S.page=b.dataset.p;renderNav();switchPage(S.page);});}
function switchPage(id){S.page=id;document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
const el=$('page-'+id);el.classList.add('active');const R={dashboard:renderDash,services:renderSvc,site:renderSite,backup:renderBackup,activation:renderActivation,logs:renderLogs,tools:renderTools,security:renderSec,audit:renderAudit};R[id]();}

/* ===== 状态轮询 ===== */
S.perf=[];/* {t,cpu,memPct,memUsedMB,memTotalMB} 性能采样历史，最多 30 条 */
async function loadStatus(){try{S.status=await api('/api/status');applyTopbar();samplePerf();const pg=$('page-'+S.page);if(S.page==='dashboard'&&pg.classList.contains('active'))renderDash();else if(S.page==='services'&&pg.classList.contains('active'))renderSvc();}catch(e){/* 网络抖动忽略 */}}
function startPolling(){clearInterval(S.statTimer);loadStatus();S.statTimer=setInterval(loadStatus,5000);}
function samplePerf(){const st=S.status;if(!st||st.cpuPct==null&&st.memTotalMB==null)return;
S.perf.push({t:Date.now(),cpu:st.cpuPct!=null?Math.min(100,Math.max(0,st.cpuPct)):null,
memPct:st.memUsedMB!=null&&st.memTotalMB!=null?Math.min(100,Math.max(0,Math.round(st.memUsedMB/st.memTotalMB*100))):null,
memUsedMB:st.memUsedMB,memTotalMB:st.memTotalMB});
if(S.perf.length>30)S.perf.shift();
if($('perfCanvas'))drawPerf();}
function drawPerf(){const cv=$('perfCanvas');if(!cv)return;const dpr=window.devicePixelRatio||1;const W=cv.clientWidth||cv.parentElement.clientWidth-16,H=140;
cv.width=W*dpr;cv.height=H*dpr;const c=cv.getContext('2d');c.scale(dpr,dpr);
c.clearRect(0,0,W,H);const pad=8;const max=100;
const grid=c.createLinearGradient(0,0,0,H);grid.addColorStop(0,'rgba(99,102,241,.06)');grid.addColorStop(1,'rgba(99,102,241,0)');
c.fillStyle=grid;c.fillRect(0,0,W,H);
c.strokeStyle='rgba(148,163,184,.12)';c.lineWidth=1;c.font='9.5px monospace';c.fillStyle='rgba(148,163,184,.55)';c.textAlign='right';
for(let g=0;g<=4;g++){const y=pad+(H-pad*2)*g/4;c.beginPath();c.moveTo(0,y);c.lineTo(W,y);c.stroke();c.fillText(String(Math.round(max-g*max/4)),W-2,y+3);}
const draw=(key,color)=>{const pts=S.perf.map(p=>p[key]).filter(v=>v!=null);if(pts.length<2)return;
const n=pts.length;const x0=W-8,x1=8,step=(x0-x1)/(n-1);
c.beginPath();pts.forEach((v,i)=>{const x=x1+i*step,y=pad+(H-pad*2)*(1-v/max);i===0?c.moveTo(x,y):c.lineTo(x,y);});
c.strokeStyle=color;c.lineWidth=1.8;c.lineJoin='round';c.lineCap='round';c.stroke();
c.fillStyle=color;c.beginPath();c.arc(x1+(n-1)*step,pad+(H-pad*2)*(1-pts[n-1]/max),2.6,0,Math.PI*2);c.fill();};
draw('cpu','#22d3ee');draw('memPct','#a78bfa');
const last=S.perf[S.perf.length-1];
const upd=(id,txt)=>{const el=$(id);if(el)el.textContent=txt;};
upd('perfCpu',last&&last.cpu!=null?last.cpu+'%':'--');
upd('perfMem',last?fmtMem(last.memUsedMB)+' / '+fmtMem(last.memTotalMB):'--');
upd('perfCount',String(S.perf.length)+'/30');}
function applyTopbar(){const st=S.status;if(!st)return;
const setChip=(id,s)=>{const dot=$(id);const ss=svcByName(s);if(!ss){dot.className='dot';return;}dot.className='dot '+(ss.running?'ok':'err');};
setChip('chipMysql','MySQL');setChip('chipNginx','Nginx');setChip('chipNode','NodeServer');
$('chipDisk').innerHTML=`<span class="dot ${st.diskGB!=null&&st.diskGB<=st.diskWarn?'warn':'ok'}"></span>磁盘 ${st.diskGB!=null?st.diskGB+' GB':'--'}`;}
function svcCard(s){
const st=s.proc?`<span class="mono">PID ${s.pid}</span> · ${s.proc.name} · CPU ${s.proc.cpu}% · 内存 ${fmtMem(s.proc.memMB)}`:'';
return `<div class="${svcCls(s)}"><div class="svc-top"><span class="dot ${s.running?'ok':'err'}"></span><span class="name">${esc(s.name)}</span><span class="port">端口 ${s.port}</span></div>
<div class="svc-meta">${s.running?'<b style="color:#4ade80">运行中</b>':'<b style="color:#f87171">已停止</b>'}<br>${st||'未监听端口'}</div>
<div class="svc-actions">
<button class="btn btn-success btn-sm" onclick="svcAction('start','${esc(s.name)}')">启动</button>
<button class="btn btn-ghost btn-sm" onclick="svcAction('stop','${esc(s.name)}')">停止</button>
<button class="btn btn-ghost btn-sm" onclick="svcAction('restart','${esc(s.name)}')">重启</button>
</div></div>`;}
function svcAction(action,name){const label={start:'启动',stop:'停止',restart:'重启'}[action];
api('/api/service',{method:'POST',body:JSON.stringify({action,name})}).then(r=>{toast(`${name} ${label}完成`);opLog(r.message,'ok');loadStatus();}).catch(e=>toast(e.message,'err'));}

const run=st.services.filter(x=>x.running).length;
const cpuPct=st.cpuPct!=null?st.cpuPct:null;
const memPct=st.memUsedMB!=null&&st.memTotalMB!=null?Math.min(100,Math.max(0,Math.round(st.memUsedMB/st.memTotalMB*100))):null;
const memTxt=st.memUsedMB!=null&&st.memTotalMB!=null?fmtMem(st.memUsedMB)+' / '+fmtMem(st.memTotalMB):'--';
const cpuWarn=cpuPct!=null&&cpuPct>80,memWarn=memPct!=null&&memPct>80;
p.innerHTML=`
<div class="page-head"><h2>仪表盘</h2><p>服务器运行概况与快捷操作</p><div class="spacer"></div>
<span class="chip ${st.isAdmin?'':'chip-warn'}">${st.isAdmin?'管理员权限':'普通权限'}</span>
<span class="chip">内网 ${esc(st.lanIp||'--')}</span>
<button class="btn btn-ghost" onclick="loadStatus();toast('状态已刷新')">刷新</button></div>
<div class="grid g4">
<div class="card"><div class="stat"><div class="ic">${IC.svc}</div><div><div class="num">${run}/${st.services.length}</div><div class="lbl">服务运行中</div></div></div></div>
<div class="card"><div class="stat"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 1v3M15 1v3M9 20v3M15 20v3M1 9h3M1 15h3M20 9h3M20 15h3"/></svg></div><div><div class="num">${cpuPct!=null?cpuPct+'<span style="font-size:12px;color:var(--muted)">%</span>':'--'}</div><div class="lbl">${cpuWarn?'<span style="color:#fbbf24">CPU 负载偏高</span>':'CPU 使用率'}</div></div></div>
<div class="meter ${cpuWarn?'warn':''}"><i style="width:${cpuPct!=null?cpuPct:0}%"></i></div></div>
<div class="card"><div class="stat"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h4M6 14h8"/></svg></div><div><div class="num">${memPct!=null?memPct+'<span style="font-size:12px;color:var(--muted)">%</span>':'--'}</div><div class="lbl">${memWarn?'<span style="color:#fbbf24">内存占用偏高</span>':'内存占用'} · ${memTxt}</div></div></div>
<div class="meter ${memWarn?'warn':''}"><i style="width:${memPct!=null?memPct:0}%"></i></div></div>
<div class="card"><div class="stat"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg></div><div><div class="num">${st.diskGB!=null?st.diskGB+'<span style="font-size:12px;color:var(--muted)"> GB</span>':'--'}</div><div class="lbl">${warn?'<span style="color:#fbbf24">磁盘空间不足</span>':'磁盘剩余空间'}</div></div></div></div>
</div>
<div class="grid g2">
<div class="card"><div class="card-title">${IC.svc} 服务状态</div><div class="grid">${svcAll}</div></div>
<div class="card"><div class="card-title">${IC.dash} 一键启停</div>
<div class="svc-quick">
${st.services.map(s=>`<div class="sq-row"><span class="dot ${s.running?'ok':'err'}"></span><b>${esc(s.name)}</b><span class="sq-port">:${s.port}</span><span class="spacer"></span>
<button class="btn btn-success btn-sm" onclick="svcAction('start','${esc(s.name)}')">启动</button>
<button class="btn btn-danger btn-sm" onclick="svcAction('stop','${esc(s.name)}')">停止</button>
<button class="btn btn-ghost btn-sm" onclick="svcAction('restart','${esc(s.name)}')">重启</button></div>`).join('')}
</div>
<div class="form-row" style="flex-wrap:wrap;margin-top:10px">
<button class="btn btn-brand" onclick="svcAction('start','all')">一键全部启动</button>
<button class="btn btn-ghost" onclick="svcAction('stop','all')">一键全部停止</button>
<button class="btn btn-success" onclick="openDesktop('site')">一键打开网站</button>
<button class="btn btn-ghost" onclick="quickBackup()">立即备份数据</button>

</div>
<div class="muted" style="font-size:12px;margin-top:6px">提示：停止 NodeServer 会中断网站访问；启动/停止服务由本机 PowerShell 执行。</div>
</div></div>
<div class="card"><div class="card-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 20h18M6 16l4-5 3 3 5-7"/></svg> 性能曲线 <span class="legend"><span class="lg lg-cpu"></span>CPU</span><span class="legend"><span class="lg lg-mem"></span>内存</span><span class="spacer"></span><span class="muted" style="font-size:12px">最近 30 次采样 · 约 2.5 分钟</span></div>
<div class="svc-quick" style="flex-direction:row;flex-wrap:wrap">
<div class="sq-row" style="flex:1;min-width:150px"><span class="dot ${cpuWarn?'warn':'ok'}"></span><b>CPU</b><span class="spacer"></span><b id="perfCpu">${cpuPct!=null?cpuPct+'%':'--'}</b></div>
<div class="sq-row" style="flex:1;min-width:150px"><span class="dot ${memWarn?'warn':'ok'}"></span><b>内存</b><span class="spacer"></span><b id="perfMem">${memTxt}</b></div>
</div>
<canvas id="perfCanvas" height="150"></canvas>
<div class="muted" style="font-size:11px;margin-top:4px">CPU 为瞬时采样；内存为全系统已用 / 总量。曲线随每次状态刷新自动追加（<span id="perfCount">0/30</span>）。</div>
</div></div>`;
drawPerf();}

${st.services.map(s=>`<tr><td><b>${esc(s.name)}</b></td><td class="mono">${s.port}</td>
<td><span class="dot ${s.running?'ok':'err'}"></span> ${s.running?'<span style="color:#4ade80">运行中</span>':'<span style="color:#f87171">已停止</span>'}</td>

</table></div>

async function checkPort(){const port=$('portCheckInput').value.trim()||'3456';const r=await api('/api/ports?port='+encodeURIComponent(port));const el=$('portResult');
el.innerHTML=r.occupied?`<span style="color:#f87171">● 端口 ${r.port} 被占用</span> — PID ${r.pid}（${esc(r.proc?r.proc.name:'未知进程')}）`:`<span style="color:#4ade80">● 端口 ${r.port} 空闲</span>`;}

api('/api/ports/kill',{method:'POST',body:JSON.stringify({port,confirm:CONFIRMS.kill})}).then(r=>{toast(r.message);opLog(r.message,'ok');checkPort();}).catch(e=>toast(e.message,'err'));});}

function renderLogs(){const p=$('page-logs');
p.innerHTML=`

async function loadRecentLogs(){const el=$('logList');if(!el)return;try{const r=await api('/api/logs/recent');

el.innerHTML=r.files.map(f=>`<div style="margin-bottom:14px"><div class="muted" style="font-size:12px;margin-bottom:6px">${esc(f.name)} <span style="float:right">共 ${f.tail.length} 行</span></div><div class="logbox">${f.tail.map(l=>esc(l)).join('\n')}</div></div>`).join('');}

async function searchLogs(){const kw=$('logKw').value.trim();const res=$('searchResult');
if(!kw)return toast('请输入搜索关键词','warn');res.innerHTML='<span class="spin"></span> 搜索中…';
try{const r=await api('/api/logs/search',{method:'POST',body:JSON.stringify({keyword:kw})});
res.innerHTML=r.total?`找到 <b>${r.total}</b> 条匹配，展示前 ${r.matches.length} 条：`:'<span style="color:#4ade80">未发现匹配项</span>';
if(r.matches.length){res.innerHTML+='<div class="logbox" style="max-height:260px;margin-top:8px">'+r.matches.map(m=>{const e=esc(m);const hl=kw.split(/\s+/).filter(Boolean).reduce((s,k)=>s.replace(new RegExp('('+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<b class="err">$1</b>'),e);return hl;}).join('\n')+'</div>';}}
catch(e){res.innerHTML='<span style="color:#f87171">'+esc(e.message)+'</span>';}}

api('/api/logs/clear',{method:'POST',body:'{}'}).then(r=>{toast(r.message);opLog(r.message,'ok');loadRecentLogs();}).catch(e=>toast(e.message,'err'));});}

/* ===== 激活码管理 ===== */
let AC={codes:[],kw:''};
function renderActivation(){const p=$('page-activation');
p.innerHTML=`<div class="page-head"><h2>激活码管理</h2><p>激活码保存在服务器本地文件（离线可用）；已使用的码永久绑定，未使用的码可作废</p><div class="spacer"></div><button class="btn btn-ghost" onclick="loadActivation()">刷新</button></div>
<div class="grid g4" id="acStats"><div class="empty">加载中…</div></div>
<div class="card"><div class="card-title">${IC.ac} 激活码列表</div>
<div class="form-row"><input type="text" id="acKw" placeholder="搜索激活码 / 备注 / 创建人" value="${esc(AC.kw)}" onkeydown="if(event.key==='Enter')activationSearch()"><button class="btn btn-brand" onclick="activationSearch()">搜索</button>
<select id="acFilter" onchange="renderAcList()"><option value="">全部状态</option><option value="unused">未使用</option><option value="used">已使用</option><option value="revoked">已作废</option><option value="expired">已过期</option></select>
<button class="btn btn-warn" onclick="acGenerateModal()">生成激活码</button></div>
<div id="acList"><div class="empty">加载中…</div></div></div>`;
loadActivation();}
async function loadActivation(){const st=$('acStats'),el=$('acList');if(!st)return;
try{const r=await api('/api/activation-codes');AC.codes=r.data.codes||[];
const items=[{num:r.data.total,lbl:'总计'},{num:r.data.unused,lbl:'未使用'},{num:r.data.used,lbl:'已使用'},{num:r.data.revoked,lbl:'已作废'},{num:r.data.expired||0,lbl:'已过期'}];
st.innerHTML=items.map(x=>`<div class="card"><div class="stat"><div class="ic">${IC.ac}</div><div><div class="num">${x.num}</div><div class="lbl">${x.lbl}</div></div></div></div>`).join('');
renderAcList();}catch(e){if(el)el.innerHTML='<div class="empty">'+esc(e.message)+'</div>';}}
function acState(c){if(c.used)return'used';if(c.revoked)return'revoked';if(c.expires_at&&new Date(c.expires_at).getTime()<=Date.now())return'expired';return'unused'}
function renderAcList(){const el=$('acList');if(!el)return;
const kw=AC.kw.toLowerCase(),f=$('acFilter')?$('acFilter').value:'';
const rows=AC.codes.slice().reverse().filter(c=>{const st=acState(c);
if(f&&st!==f)return false;
if(!kw)return true;
return String(c.code||'').toLowerCase().includes(kw)||String(c.note||'').toLowerCase().includes(kw)||String(c.created_by||'').toLowerCase().includes(kw);});
if(!rows.length){el.innerHTML='<div class="empty">无匹配激活码</div>';return;}
const fmt=t=>esc(String(t||'').replace('T',' ').slice(0,19));
el.innerHTML='<table><tr><th>激活码</th><th>状态</th><th>备注</th><th>创建人</th><th>创建时间</th><th>使用 / 作废信息</th><th>操作</th></tr>'+
rows.map(c=>{const st=acState(c);
const tag={unused:'<span style="color:#4ade80">未使用</span>',used:'<span style="color:#fbbf24">已使用</span>',revoked:'<span style="color:#f87171">已作废</span>',expired:'<span style="color:#f97316">已过期</span>'}[st];
const info=c.used?('由 <b>'+esc(c.used_by||'?')+'</b> 于 '+fmt(c.used_at)+' 使用'):(c.revoked?('由 '+esc(c.revoked_by||'?')+' 于 '+fmt(c.revoked_at)+' 作废'+(c.revoked_reason?'（'+esc(c.revoked_reason)+'）':'')):(c.expires_at?('有效期至 <b class="mono">'+fmt(c.expires_at)+'</b>'+(st==='expired'?'<span style="color:#f97316">（已过期）</span>':'')):'-'));
return `<tr><td class="mono">${esc(c.code)}</td><td>${tag}</td><td>${esc(c.note||'-')}</td><td>${esc(c.created_by||'-')}</td><td class="mono">${fmt(c.created_at)}</td><td>${info}</td>
<td><button class="btn btn-ghost btn-sm" onclick="acCopy('${esc(c.code)}')">复制</button>${st==='unused'?' <button class="btn btn-danger btn-sm" onclick="acRevoke(\''+esc(c.code)+'\')">作废</button>':''}</td></tr>`;}).join('')+'</table>';}
function activationSearch(){AC.kw=$('acKw').value.trim();renderAcList();}
function acCopy(code){navigator.clipboard.writeText(code).then(()=>toast('已复制 '+code)).catch(()=>toast('复制失败，请手动选择复制','warn'));}
function acRevoke(code){confirmModal('作废激活码',`确定要作废激活码 <b class="mono">${esc(code)}</b> 吗？<br>作废后立即失效且不可恢复；已被使用的码无法作废。`,'btn-danger','作废',(reason)=>{
api('/api/activation-codes/revoke',{method:'POST',body:JSON.stringify({code,reason})}).then(r=>{toast(r.message);opLog(r.message,'ok');loadActivation();}).catch(e=>toast(e.message,'err'));},'输入作废原因（必填）');}
function acGenerateModal(){const mask=$('modalMask'),box=$('modalBox');
box.innerHTML=`<h3>生成激活码</h3><div class="modal-body">激活码保存在服务器本地文件，生成后可复制分发给用户注册使用；可设置有效期，过期后注册将提示已过期。
<div class="form-row" style="margin-top:10px"><input type="number" id="acGenCount" min="1" max="200" value="5" placeholder="数量" style="flex:0 0 110px" title="数量（1-200）"><input type="number" id="acGenExpires" min="0" max="3650" value="0" placeholder="有效期天数（0=永久）" style="flex:0 0 180px" title="有效期天数，0 = 永久"><input type="text" id="acGenNote" placeholder="备注（可选）" style="flex:1" maxlength="100"></div></div>
<div class="modal-actions"><button class="btn btn-ghost" id="mCancel">取消</button><button class="btn btn-brand" id="mOk">生成</button></div>`;
mask.classList.add('show');const close=()=>{mask.classList.remove('show');box.innerHTML='';};
box.querySelector('#mCancel').onclick=close;
box.querySelector('#mOk').onclick=async()=>{const count=parseInt(box.querySelector('#acGenCount').value,10)||0;const expiresDays=Math.max(0,Math.min(3650,parseInt(box.querySelector('#acGenExpires').value,10)||0));const note=box.querySelector('#acGenNote').value.trim();
if(count<1||count>200)return toast('数量需在 1-200 之间','warn');
try{const r=await api('/api/activation-codes/generate',{method:'POST',body:JSON.stringify({count,note,expiresDays})});
close();opLog('生成激活码 '+r.data.count+' 枚','ok');
const expLine=r.data.expiresAt?`<p class="muted" style="margin:6px 0 0">有效期至：<b class="mono">${esc(String(r.data.expiresAt).replace('T',' ').slice(0,19))}</b></p>`:'';
box.innerHTML=`<h3>生成成功（${r.data.count} 枚）</h3><div class="modal-body"><div class="logbox" style="max-height:260px">${r.data.codes.map(esc).join('\n')}</div>${expLine}<p class="muted" style="margin-top:8px">请立即复制保存；之后仍可在列表中查看。</p></div>
<div class="modal-actions"><button class="btn btn-ghost" id="mCancel2">关闭</button><button class="btn btn-brand" id="mCopyAll">复制全部</button></div>`;
mask.classList.add('show');const close2=()=>{mask.classList.remove('show');box.innerHTML='';};
box.querySelector('#mCancel2').onclick=close2;
box.querySelector('#mCopyAll').onclick=()=>{navigator.clipboard.writeText(r.data.codes.join('\n')).then(()=>toast('已复制全部激活码')).catch(()=>toast('复制失败，请手动选择复制','warn'));};
loadActivation();}catch(e){toast(e.message,'err');}};}

/* ===== Modal ===== */
function confirmModal(title,body,btnCls,btnText,onOk,placeholder){const mask=$('modalMask'),box=$('modalBox');
box.innerHTML=`<h3>${title}</h3><div class="modal-body">${body}</div><input type="text" id="confirmInput" placeholder="${placeholder||'输入确认短语'}">
<div class="modal-actions"><button class="btn btn-ghost" id="mCancel">取消</button><button class="btn ${btnCls}" id="mOk">${btnText}</button></div>`;
mask.classList.add('show');const input=box.querySelector('#confirmInput');input.focus();
const close=()=>{mask.classList.remove('show');box.innerHTML='';};
box.querySelector('#mCancel').onclick=close;
box.querySelector('#mOk').onclick=()=>{const v=input.value.trim();close();if(v)onOk(v);else toast(placeholder?'输入不能为空，已取消':'未输入确认短语，已取消','warn');};
mask.onclick=e=>{if(e.target===mask)close();};}

/* ===== 事件与启动 ===== */
function bind(){document.getElementById('initBtn').onclick=initPanel;
document.getElementById('loginBtn').onclick=doLogin;
document.getElementById('btnLogout').onclick=()=>{api('/api/logout',{method:'POST',body:'{}'}).catch(()=>{});doLogoutUI();};
document.getElementById('opHead').onclick=e=>{if(e.target.id!=='opClear')document.getElementById('opPanel').classList.toggle('open');};
document.getElementById('opClear').onclick=()=>{document.getElementById('opBody').innerHTML='';};
document.getElementById('loginPwd').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
document.getElementById('initPwd2').addEventListener('keydown',e=>{if(e.key==='Enter')initPanel();});
document.getElementById('wizNext').onclick=()=>wizGo(2);
document.getElementById('wizStartAll').onclick=wizStartAll;
document.getElementById('wizEnter').onclick=()=>enterApp();}
(function init(){bind();
api('/api/bootstrap').then(r=>{S.initialized=r.initialized;
if(r.initialized){showAuth('login');}
else{showAuth('init');wizGo(1);renderWizEnv(r.env);}
}).catch(e=>{document.body.innerHTML='<div style="padding:40px;text-align:center;color:#f87171">面板服务不可用：'+esc(e.message)+'<br><br><span class="muted">请确认 panel-server.js 已启动（双击 start-panel.bat）</span></div>';});})();
</script>
