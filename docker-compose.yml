# ==================== 境途同游 Web — docker-compose ====================
# 一键起站（应用 + MySQL）：
#   cp docker.env.example .env      # 填写 SESSION_SECRET / ENCRYPT_KEY / 数据库密码
#   docker compose up -d --build
#   curl -fsS http://127.0.0.1:3456/api/health/ready
#
# 说明：
# - 应用容器内部通过服务名 `db` 访问数据库（MYSQL_HOST 已在下方写死，不读取宿主 .env）。
# - 数据库账号/密码（JINGTU_DB_ROOT_PASSWORD / JINGTU_DB_PASSWORD）为必填，
#   缺失时 compose 直接报错拒启——不再回退 change_me 占位默认值，防止弱口令上线。
# - SESSION_SECRET / ENCRYPT_KEY 为必填，缺失时 compose 会直接报错提示。
# - 端口默认只绑 127.0.0.1（APP_BIND），公网部署务必保持本机 Nginx / 宝塔反代并终结 TLS
#   （见 DEPLOY.md 与 deploy/nginx/jingtu.conf）；确需直连暴露时显式设 APP_BIND=0.0.0.0。
# - 公网部署（反代在后）TRUST_PROXY 默认 "1" 即可；若无反代直接暴露端口，请设 0，
#   否则登录限流/IP 黑名单可被伪造 X-Forwarded-For 绕过。

services:
  db:
    image: mysql:8.0
    container_name: jingtu-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${JINGTU_DB_ROOT_PASSWORD:?请在 .env 中设置 JINGTU_DB_ROOT_PASSWORD（勿用占位默认）}
      MYSQL_DATABASE: ${JINGTU_DB_NAME:-jingtu_group}
      MYSQL_USER: ${JINGTU_DB_USER:-jingtu_user}
      MYSQL_PASSWORD: ${JINGTU_DB_PASSWORD:?请在 .env 中设置 JINGTU_DB_PASSWORD（勿用占位默认）}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # P2-71：MySQL 服务端时区对齐应用连接（server/db.js timezone '+08:00'）与
      # 定时任务 Asia/Shanghai（server/tasks.js）。不设此项目时 NOW()/CURDATE() 按
      # UTC 计，日报统计在 00:00-08:00（北京时间）之间会统计错日。
      - --default-time-zone=+08:00
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${JINGTU_DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - jingtu-net

  app:
    build: .
    image: jingtu-web:latest
    container_name: jingtu-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3456
      # 位于反代之后保持默认 1；无反代直连公网时设 0（防伪造 X-Forwarded-For 绕过限流/黑名单）
      TRUST_PROXY: "${TRUST_PROXY:-1}"
      # 容器内访问数据库使用服务名
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${JINGTU_DB_NAME:-jingtu_group}
      MYSQL_USER: ${JINGTU_DB_USER:-jingtu_user}
      MYSQL_PASSWORD: ${JINGTU_DB_PASSWORD:?请在 .env 中设置 JINGTU_DB_PASSWORD}
      # 必填密钥（缺失则启动报错）
      SESSION_SECRET: ${SESSION_SECRET:?请在 docker.env.example 中设置 SESSION_SECRET}
      ENCRYPT_KEY: ${ENCRYPT_KEY:?请在 docker.env.example 中设置 ENCRYPT_KEY}
      # 业务配置（可选）
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      GROUP_ID: ${GROUP_ID:-}
      VRC_API_KEY: ${VRC_API_KEY:-}
      VRC_GROUP_URL: ${VRC_GROUP_URL:-}
      KOOK_URL: ${KOOK_URL:-}
      OOPZ_URL: ${OOPZ_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # 站点对外地址（邮件内链接、sitemap 等使用；留空则代码回退本地默认值，生产务必设置）
      APP_URL: ${APP_URL:-}
      # 数据库恢复接口口令：留空时 /api/db-recover 写接口直接 503（安全默认）
      RECOVERY_TOKEN: ${RECOVERY_TOKEN:-}
      # 邮件通知（可选）：SMTP_HOST 留空则全部邮件功能静默跳过；
      # 口令变量 SMTP_PASS 优先、SMTP_PASSWORD 为历史兼容（见 server/mailer.js）
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      # Redis 缓存（可选）：留空即完全关闭，应用回退进程内实现；
      # 容器内如需 Redis，请自行添加 redis 服务并把 REDIS_HOST 指向该服务名
      REDIS_HOST: ${REDIS_HOST:-}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      # 直播推流（可选）
      RTMP_HOST: ${RTMP_HOST:-}
      RTMP_PORT: ${RTMP_PORT:-1935}
      RTMP_APP: ${RTMP_APP:-live}
      HLS_BASE_URL: ${HLS_BASE_URL:-}
    ports:
      # 默认只绑回环，经本机反代对外；确需直连公网暴露时设 APP_BIND=0.0.0.0
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3456}:3456"
    volumes:
      - uploads:/app/uploads
      - backups:/app/backups
      - logs:/app/logs
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3456/api/health/live',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - jingtu-net

volumes:
  db_data:
  uploads:
  backups:
  logs:

networks:
  jingtu-net:
    driver: bridge
