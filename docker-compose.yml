# ==================== 境途同游 Web — docker-compose ====================
# 一键起站（应用 + MySQL）：
#   cp docker.env.example .env.docker  # 填写 SESSION_SECRET / ENCRYPT_KEY / 数据库密码
#   docker compose --env-file .env.docker up -d --build
#   curl -fsS http://127.0.0.1:3456/api/health/ready
# 注意：勿 cp 到根目录 .env——该文件同时被 Node dotenv 读取，与裸机/宝塔实例并存会互相污染。
#
# 说明：
# - 应用容器内部通过服务名 `db` 访问数据库（MYSQL_HOST 已在下方写死，不读取宿主 .env）。
# - 数据库账号/密码（JINGTU_DB_ROOT_PASSWORD / JINGTU_DB_PASSWORD）为必填，
#   缺失时 compose 直接报错拒启——不再回退 change_me 占位默认值，防止弱口令上线。
# - SESSION_SECRET / ENCRYPT_KEY 为必填，缺失时 compose 会直接报错提示。
# - 端口默认只绑 127.0.0.1（APP_BIND），公网部署务必保持本机 Nginx / 宝塔反代并终结 TLS
#   （见 DEPLOY.md 与 deploy/nginx/jingtu.conf）；确需直连暴露时显式设 APP_BIND=0.0.0.0。
# - 公网部署（反代在后）请显式设 TRUST_PROXY=1（compose 默认 0 = 不信任代理，与 server.js
#   安全默认一致）；若无反代直接暴露端口保持 0，否则登录限流/IP 黑名单可被伪造
#   X-Forwarded-For 绕过。
#
# ---- 自定义存储位置（可选）----
# STORAGE_ROOT=<宿主机目录>：所有持久数据改挂载到该宿主机目录下，默认 ./docker-data
# （docker-compose.yml 所在目录），自动创建子目录：
#   mysql/（MySQL 数据目录）uploads/ backups/ logs/ assets/ data/（激活码 + SQLite）
# 示例（Linux）：STORAGE_ROOT=/opt/jingtu/data；Windows：STORAGE_ROOT=D:/docker/jingtu
# ⚠️ Linux 权限：应用容器以 node 用户(uid 1000)运行，首次部署请执行
#   sudo chown -R 1000:1000 $STORAGE_ROOT
#   （MySQL 数据目录由镜像入口自动 chown 为 uid 999，无需手动处理；Docker Desktop
#   即 Windows/macOS 下权限自动同步，无需上述操作）
#
# ---- 自定义端口（可选）----
# APP_PORT=<宿主端口>            对外映射端口，默认 3456（例：APP_PORT=8080 → 127.0.0.1:8080:3456）
# APP_BIND=<绑定地址>            默认 127.0.0.1；直连公网才设 0.0.0.0（并保持 TRUST_PROXY=0）
# APP_CONTAINER_PORT=<容器内端口> 高级：改应用自身监听端口，默认 3456
#   （改此项时 healthcheck 与 PORT 已同步参数化，无需再改 compose 其他位置）

services:
  db:
    image: mysql:8.0
    container_name: jingtu-db
    restart: unless-stopped
    # MySQL 8 关闭需冲刷 InnoDB 缓冲（大库可能超默认 10s）；给足宽限避免被 SIGKILL
    stop_grace_period: 30s
    environment:
      MYSQL_ROOT_PASSWORD: ${JINGTU_DB_ROOT_PASSWORD:?请在 .env 中设置 JINGTU_DB_ROOT_PASSWORD（勿用占位默认）}
      MYSQL_DATABASE: ${JINGTU_DB_NAME:-jingtu_group}
      MYSQL_USER: ${JINGTU_DB_USER:-jingtu_user}
      MYSQL_PASSWORD: ${JINGTU_DB_PASSWORD:?请在 .env 中设置 JINGTU_DB_PASSWORD（勿用占位默认）}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # P2-71：MySQL 服务端时区对齐应用连接（server/db.js timezone '+08:00'）与
      # 定时任务 Asia/Shanghai（server/tasks.js）。不设此项目时 NOW()/CURDATE() 按
      # UTC 计，日报统计在 00:00-08:00（北京时间）之间会统计错日。
      - --default-time-zone=+08:00
    volumes:
      - "${STORAGE_ROOT:-./docker-data}/mysql:/var/lib/mysql"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${JINGTU_DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging:
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - jingtu-net

  app:
    build: .
    image: jingtu-web:latest
    container_name: jingtu-web
    restart: unless-stopped
    # 优雅关闭含 HTTP 排空(≤5s)+连接池/Redis 释放，默认 10s 可能被 SIGKILL(退出码137)
    stop_grace_period: 30s
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: ${APP_CONTAINER_PORT:-3456}
      # P3-25：默认 0（不信任代理）与 server.js 安全默认一致——端口直连公网时不至于
      # 被伪造 X-Forwarded-For 绕过限流/黑名单；经本机 Nginx/宝塔/Docker 反代的标准部署
      # 请显式设 TRUST_PROXY=1（或按实际跳数），否则 req.ip 坍缩为 127.0.0.1。
      TRUST_PROXY: "${TRUST_PROXY:-0}"
      # 容器内访问数据库使用服务名
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${JINGTU_DB_NAME:-jingtu_group}
      MYSQL_USER: ${JINGTU_DB_USER:-jingtu_user}
      MYSQL_PASSWORD: ${JINGTU_DB_PASSWORD:?请在 .env 中设置 JINGTU_DB_PASSWORD}
      # 必填密钥（缺失则启动报错）
      SESSION_SECRET: ${SESSION_SECRET:?请在 docker.env.example 中设置 SESSION_SECRET}
      ENCRYPT_KEY: ${ENCRYPT_KEY:?请在 docker.env.example 中设置 ENCRYPT_KEY}
      # 业务配置（可选）
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      GROUP_ID: ${GROUP_ID:-}
      VRC_API_KEY: ${VRC_API_KEY:-}
      VRC_GROUP_URL: ${VRC_GROUP_URL:-}
      # 运维面板（panel/）为 Windows 专属工具链，Docker 镜像不打包；
      # 显式禁用入口后后台隐藏「运维面板」按钮，避免点击报「启动失败」
      PANEL_ENABLED: "0"
      # P3-19：VRChat 数据源附加（可选），留空代码回退默认值（见 server/vrc.js:9、
      # server/routes/collections.js:326）
      VRC_USER_AGENT: ${VRC_USER_AGENT:-}
      VRCX_SEARCH_URL: ${VRCX_SEARCH_URL:-}
      KOOK_URL: ${KOOK_URL:-}
      OOPZ_URL: ${OOPZ_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # 站点对外地址（邮件内链接、sitemap 等使用；留空则代码回退本地默认值，生产务必设置）
      APP_URL: ${APP_URL:-}
      # P3-19：站点地址补充三件套（可选）——SITEMAP_BASE_URL 优先、APP_URL 次之、
      # APP_BASE_URL 最后回退（server/routes/sitemap.js:18）；WS_URL 下发前端 WS 地址
      # （server/routes/stats.js:21，留空前端按当前页面自动探测）
      SITEMAP_BASE_URL: ${SITEMAP_BASE_URL:-}
      APP_BASE_URL: ${APP_BASE_URL:-}
      WS_URL: ${WS_URL:-}
      # 数据库恢复接口口令：留空时 /api/system/db-recover 写接口直接 503（安全默认）
      RECOVERY_TOKEN: ${RECOVERY_TOKEN:-}
      # 邮件通知（可选）：SMTP_HOST 留空则全部邮件功能静默跳过；
      # 口令变量 SMTP_PASS 优先、SMTP_PASSWORD 为历史兼容（见 server/mailer.js）
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      # Redis 缓存（可选）：留空即完全关闭，应用回退进程内实现；
      # 容器内如需 Redis，请自行添加 redis 服务并把 REDIS_HOST 指向该服务名
      REDIS_HOST: ${REDIS_HOST:-}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      # 直播推流（可选）
      RTMP_HOST: ${RTMP_HOST:-}
      RTMP_PORT: ${RTMP_PORT:-1935}
      RTMP_APP: ${RTMP_APP:-live}
      HLS_BASE_URL: ${HLS_BASE_URL:-}
      # P2-102：激活码离线存储路径（Dockerfile 已 chown server/data，node 可写；
      # 默认落 /app/server/data/activation-codes.json，如需自定义可通过此变量覆盖）
      ACTIVATION_CODES_FILE: ${ACTIVATION_CODES_FILE:-}
      # P3-19：数据保留策略（server/tasks.js 每日清理）——留空代码回退默认值
      # （FILE=90 / NOTIFICATION=30 / BACKUP=7，见 tasks.js:58/144/172）
      FILE_RETENTION_DAYS: ${FILE_RETENTION_DAYS:-}
      NOTIFICATION_RETENTION_DAYS: ${NOTIFICATION_RETENTION_DAYS:-}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-}
      # 第九批：SQLite 嵌入式模式键透传（docker.env.example 已登记）——留空即默认
      # MySQL 模式；注意容器内切换 SQLite 需同时移除/绕过下方 db 服务与必填校验。
      JINGTU_DB_ENGINE: ${JINGTU_DB_ENGINE:-}
      JINGTU_SQLITE_PATH: ${JINGTU_SQLITE_PATH:-}
    ports:
      # 默认只绑回环，经本机反代对外；确需直连公网暴露时设 APP_BIND=0.0.0.0
      # 左=宿主端口(APP_PORT 自定义)、右=容器内端口(APP_CONTAINER_PORT 自定义)
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3456}:${APP_CONTAINER_PORT:-3456}"
    volumes:
      # 持久数据全部绑定到宿主机目录（STORAGE_ROOT 可自定义，默认 ./docker-data）
      - "${STORAGE_ROOT:-./docker-data}/uploads:/app/uploads"
      - "${STORAGE_ROOT:-./docker-data}/backups:/app/backups"
      - "${STORAGE_ROOT:-./docker-data}/logs:/app/logs"
      # 用户相册落盘 + VRChat 头像代理缓存
      - "${STORAGE_ROOT:-./docker-data}/assets:/app/assets"
      # server/data：激活码文件（activation-codes.json）与 SQLite 模式库文件
      - "${STORAGE_ROOT:-./docker-data}/data:/app/server/data"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:${APP_CONTAINER_PORT:-3456}/api/health/live',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    logging:
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - jingtu-net

networks:
  jingtu-net:
    driver: bridge
