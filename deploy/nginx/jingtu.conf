# =============================================================================
# 境途同游 Web — Nginx 反向代理配置（模板）
# -----------------------------------------------------------------------------
# 使用方式（二选一）：
#   A. 宝塔：网站 → 设置 → 配置文件，整体替换为本文件内容（先替换下方占位符）；
#   B. 裸 Nginx：include 到对应 server 块，或复制为 /etc/nginx/conf.d/jingtu.conf。
#
# 占位符（运行 install.sh 会自动替换；手动部署请自行替换）：
#   __DOMAIN__      站点域名，如 jingtu.example.com（留空用 _ 匹配任意）
#   __PORT__        Node 监听端口（默认 3456）
#   __PROJECT_DIR__ 项目绝对路径，如 /www/wwwroot/jingtu-web
#   __CERT_DIR__    证书目录，如 /www/server/panel/vhost/cert/jingtu.example.com
#
# 注意：站点根目录应设为 __PROJECT_DIR__/public（静态资源由 Node 一并服务，
#       这里 Nginx 仅做反向代理）；数据库 3306 与 Node 端口不要暴露到公网。
# =============================================================================

# P2-91：Upgrade 头联动 Connection——此前 location 内硬编码 Connection "upgrade"，
# 所有普通 HTTP 响应都被打上 upgrade，破坏 keep-alive 且非规范。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# P2-91：接口级限流（登录/注册 5r/m，其余 API 30r/s 突发 60）。
# 仅作用于 API，避免误伤静态资源与 WebSocket 握手后的长连接。
limit_req_zone $binary_remote_addr zone=jingtu_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=jingtu_auth:10m rate=5r/m;

server {
    listen 80;
    server_name __DOMAIN__;
    # 证书签发前暂用，签发后整段由 443 接管；宝塔部署建议直接在 443 段监听
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name __DOMAIN__;

    ssl_certificate     __CERT_DIR__/fullchain.pem;
    ssl_certificate_key __CERT_DIR__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # P2-76：与相册单文件上限 500MB（server/routes/album.js photoUpload，视频上传）对齐；
    # 此前 200m 低于路由允许值，200-500MB 文件在反代层即被 413 拒绝，永远到不了 Node。
    client_max_body_size 500m;

    # P2-91：安全响应头（CSP / X-Frame-Options / HSTS / nosniff / Referrer-Policy）
    # 由 Node 统一设置（server/server.js 安全头中间件），且对面板路径有豁免逻辑；
    # 这里刻意不用 add_header 重复添加，避免双份头与豁免冲突。

    # 生产环境屏蔽公开的 API 文档（避免泄露接口结构）
    location = /api-docs.json { return 404; }
    location ^~ /api-docs { return 404; }

    # P2-91：登录/注册等认证接口单独限流（防撞库），超出直接 429
    location ^~ /api/auth/ {
        limit_req zone=jingtu_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # P2-91：其余 API 匀速限流，容忍突发
    location ^~ /api/ {
        limit_req zone=jingtu_api burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket（/ws）与常规请求共用反代
    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        # P2-91：原先硬编码 Connection "upgrade"，普通 HTTP 请求也被强制 upgrade；
        # 改由 map $http_upgrade $connection_upgrade 联动（无 Upgrade 头时输出 close）。
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
