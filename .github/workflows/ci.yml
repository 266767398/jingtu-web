name: CI

# P2-1：API 集成测试 + CI（工程债闭环）。
# 在 server/ 目录运行完整 Jest 套件（单元 + router 级 supertest + server.js 整机集成），
# 带覆盖率门槛（jest.config.js coverageThreshold）。测试全程不依赖 MySQL/Redis/SMTP。
on:
  push:
    branches: [jingtu-web, main, master]
  pull_request:
    branches: [jingtu-web, main, master]

# P2-96：默认最小权限（只读 GITHUB_TOKEN）；某 job 确需写权限时在其内部单独升级。
permissions:
  contents: read

jobs:
  server-test:
    name: 服务端测试（Jest：单元 + supertest 集成）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 运行测试（含覆盖率门槛）
        run: npm run test:ci

      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-node${{ matrix.node-version }}
          path: server/coverage/lcov-report
          retention-days: 7

  # P2-68：ESLint 平铺配置（server/eslint.config.js）门禁。
  # 服务端/面板目录 error 级为 0 容忍；前端 public/js 存量整体降为 warn（棘轮）。
  # no-unused-vars 存量 86 处亦为 warn 记账，清偿后升级回 error。
  lint:
    name: 代码静态检查（ESLint 0 error 门禁）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 运行 ESLint
        run: npm run lint

  # P2-68：server/test/ 下的 node:test 套件（security.test.js 等）此前从未进 CI，
  # 通过 npm run test:node（node --test test/*.test.js，通配符兼容目录参数失效的环境）补上执行通道。
  node-test:
    name: 服务端测试（node:test 原生套件）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 运行 node:test 套件
        run: npm run test:node

  # P2-96：Shell 脚本静态检查。error 起步为阻断门禁，
  # warning/style 存量清偿后可收紧 --severity 逐级升级。
  shellcheck:
    name: Shell 脚本静态检查（shellcheck）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 安装 shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: 运行 shellcheck
        run: >-
          shellcheck --severity=error
          docker-entrypoint.sh install.sh jingtu.sh
          start-services.sh test_api.sh

  # P2-96：面板 PowerShell API 静态检查（PS5.1 兼容层）。
  # 仅 Error 级阻断（解析失败/明显错误），警告与规范项不纳入门禁。
  psscript-analyzer:
    name: PowerShell 静态检查（PSScriptAnalyzer）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 安装 PSScriptAnalyzer
        run: pwsh -NoProfile -Command "Install-Module PSScriptAnalyzer -Force -Scope CurrentUser"

      - name: 运行 PSScriptAnalyzer（panel/ 目录，Error 级阻断）
        run: >-
          pwsh -NoProfile -Command
          '$r = Invoke-ScriptAnalyzer -Path panel -Recurse -Severity Error;
          if ($r) { $r | Format-Table -AutoSize | Out-String | ForEach-Object { Write-Host $_ }; exit 1 }'

  # P2-96：秘密扫描（Gitleaks，含全量历史）。报告模式：始终产出 JSON 报告
  # 供人工复核、不阻断合并——本仓库存在刻意不入库的本地秘密约定
  # （panel/panel-auth.json 已在 .gitignore），待确认历史干净后升级为硬门禁。
  secret-scan:
    name: 密钥扫描（Gitleaks 报告模式）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks detect（--exit-code 0 只报告不阻断）
        run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.18.4
          detect --source /repo --red --exit-code 0
          --report-format json --report-path /repo/gitleaks-report.json

      - name: 上传扫描报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 7
